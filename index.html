<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover">
<meta name="theme-color" content="#0F766E">
<title>신축 아파트 하자 보수 현황</title>
<meta name="description" content="신축 아파트 사전점검 하자 121건(1·2차)의 수리 완료·미완료 현황을 공간별로, 보수 전·후 사진 + 건설사 답변 + AI 보수 판단과 함께 확인하는 페이지.">
<meta property="og:type" content="website">
<meta property="og:url" content="https://piko9388.github.io/gumdanhaja/">
<meta property="og:title" content="신축 아파트 하자 보수 현황">
<meta property="og:description" content="하자 121건(1·2차) — 공간별 수리 완료/남음 + 보수 전·후 사진 + 건설사 답변 + AI 보수 판단">
<meta property="og:image" content="https://piko9388.github.io/gumdanhaja/thumbs/27499994/after_1.jpg">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏡</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F4F6F5; --card:#FFFFFF; --text:#16241F; --soft:#46554F; --muted:#5E6D68;
  --line:#E4EAE7; --teal:#0F766E; --tealD:#0B5F58; --tealBg:#ECFBF7; --tealLine:#A7F3D6;
  --done:#067A53; --doneBg:#E9FBF2; --doneLine:#7BE0B4;
  --wait:#C26A05; --waitBg:#FFF6E8; --waitLine:#FBD491;
  --pending:#0E7490; --pendingBg:#ECFCFF; --pendingLine:#9FE3EF;
  --reject:#B4530A; --rejectBg:#FBEEE0; --rejectLine:#F0C48A;
  --red:#D43A2F;
  --sh-sm:0 1px 3px rgba(0,0,0,.05); --sh-md:0 4px 14px rgba(0,0,0,.07); --sh-lg:0 14px 34px rgba(0,0,0,.14);
  --f-xs:16px; --f-sm:18px; --f:20px; --f-md:23px; --f-lg:27px; --f-xl:32px; --f-xxl:42px;
  --hdr:66px; --side:340px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html{font-size:16px;}
body{font-family:'Gowun Dodum','Apple SD Gothic Neo','Malgun Gothic',sans-serif;
  background:var(--bg); color:var(--text); line-height:1.6; font-size:var(--f); -webkit-font-smoothing:antialiased;}
button{font-family:inherit;cursor:pointer;}

.topbar{position:sticky; top:0; z-index:100; height:calc(var(--hdr) + env(safe-area-inset-top));
  background:linear-gradient(135deg,var(--teal),var(--tealD)); color:#fff;
  display:flex; align-items:center; gap:12px; padding:0 16px; padding-top:env(safe-area-inset-top); box-shadow:var(--sh-md);}
.icon-btn{width:50px;height:50px;flex:0 0 50px; border:0; border-radius:14px; background:rgba(255,255,255,.16); color:#fff; font-size:26px;
  display:flex;align-items:center;justify-content:center;}
.icon-btn:active{background:rgba(255,255,255,.3);}
.titles{flex:1;min-width:0;}
.t1{font-size:var(--f-md);font-weight:800;letter-spacing:-.02em;line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.t2{font-size:var(--f-xs);color:rgba(255,255,255,.85);margin-top:2px;}

.layout{display:flex;align-items:flex-start;}
.sidebar{flex:0 0 var(--side); width:var(--side); position:sticky; top:var(--hdr);
  height:calc(100vh - var(--hdr)); height:calc(100dvh - var(--hdr));
  overflow-y:auto; background:var(--card); border-right:1px solid var(--line); padding:14px 12px 40px;}
.scrim{display:none;}
.main{flex:1 1 auto;min-width:0;padding:0 0 60px;}

/* 차수 필터 */
.rfilter{display:flex;gap:6px;margin-bottom:14px;}
.rf{flex:1;border:2px solid var(--line);background:var(--bg);border-radius:12px;padding:11px 4px;font-size:var(--f-xs);font-weight:800;color:var(--soft);}
.rf.on{background:var(--teal);color:#fff;border-color:var(--teal);}

/* 사이드 메뉴 */
.nav-home{width:100%; text-align:left; border:2px solid var(--tealLine); background:var(--tealBg); color:var(--tealD); font-weight:800;
  font-size:var(--f-sm); padding:15px 16px; border-radius:14px; margin-bottom:10px; display:flex;align-items:center;gap:10px;}
.nav-home.active{background:var(--teal);color:#fff;border-color:var(--teal);}
.nav-need{width:100%;text-align:left;border:2px solid var(--waitLine);background:var(--waitBg);color:#9A5408;
  font-weight:800;font-size:var(--f-sm);padding:14px 16px;border-radius:14px;margin-bottom:14px;display:flex;align-items:center;gap:10px;}
.nav-need.active{background:var(--wait);color:#fff;border-color:var(--wait);}
.need-count{margin-left:auto;background:var(--wait);color:#fff;border-radius:999px;font-size:var(--f-xs);font-weight:800;padding:2px 11px;}
.nav-need.active .need-count{background:#fff;color:var(--wait);}
.home-cta{display:block;width:100%;margin-top:16px;background:var(--wait);color:#fff;border:0;border-radius:16px;
  padding:18px;font-size:var(--f-sm);font-weight:800;box-shadow:var(--sh-sm);letter-spacing:-.01em;}
.home-cta:active{background:#A85C06;}
.detail-back{display:inline-flex;align-items:center;gap:6px;margin:14px 18px 0;background:var(--card);border:1.5px solid var(--line);
  color:var(--soft);font-weight:700;font-size:var(--f-sm);padding:11px 18px;border-radius:12px;}
.detail-back:active{background:var(--bg);}
.csv-btn{display:inline-block;margin:10px auto 0;background:var(--card);border:1.5px solid var(--line);color:var(--soft);
  font-weight:700;font-size:var(--f-xs);padding:10px 16px;border-radius:10px;}
.csv-btn:active{background:var(--bg);}
@media print{
  .topbar,.sidebar,.scrim,.btn-menu,.detail-back,.csv-btn,.home-cta,.modal,.dl-link{display:none!important;}
  .main{padding:0;} body{background:#fff;font-size:13px;}
  .card,.ai-box,.builder-status,.cmp-photos,.xref,.tl,.funnel{break-inside:avoid;}
  .cmp-imgs img{max-height:8cm;width:auto;}
}
.nav-sect{font-size:var(--f-xs);font-weight:700;color:var(--muted);padding:4px 8px 8px;letter-spacing:.02em;}
.nav-group{border-bottom:1px solid var(--line);}
.nav-loc{width:100%;display:flex;align-items:center;gap:8px;background:none;border:0;padding:15px 8px;
  font-size:var(--f-sm);font-weight:700;color:var(--text);text-align:left;border-radius:10px;}
.nav-loc:active{background:var(--bg);}
.nav-loc.active{color:var(--tealD);}
.nav-loc-name{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.nav-loc-meta{display:flex;align-items:center;gap:8px;flex:0 0 auto;}
.dot{width:11px;height:11px;border-radius:50%;display:inline-block;}
.dot.done{background:var(--done);} .dot.wait{background:var(--wait);}
.nav-count{font-size:var(--f-xs);font-weight:800;color:var(--muted);background:var(--bg);border-radius:999px;padding:2px 10px;min-width:34px;text-align:center;}
.nav-caret{font-size:15px;color:var(--muted);transition:transform .2s;}
.nav-group.open .nav-caret{transform:rotate(180deg);}
.nav-items{display:none;padding:2px 0 12px;}
.nav-group.open .nav-items{display:block;}
.nav-item{width:100%;display:flex;align-items:flex-start;gap:10px;background:none;border:0;text-align:left;
  padding:13px 10px 13px 14px;border-left:3px solid transparent;border-radius:0 10px 10px 0;}
.nav-item:active{background:var(--bg);}
.nav-item.active{background:var(--tealBg);border-left-color:var(--teal);}
.ni-status{font-size:18px;flex:0 0 auto;line-height:1.4;}
.ni-text{min-width:0;}
.ni-title{display:block;font-size:var(--f-xs);font-weight:700;color:var(--text);line-height:1.35;}
.ni-label{display:block;font-size:14px;color:var(--muted);margin-top:2px;}

/* 홈 */
.wrap{max-width:760px;margin:0 auto;padding:18px;}
.intro{background:var(--card);border-radius:22px;padding:26px 24px;box-shadow:var(--sh-md);text-align:center;}
.intro-emoji{font-size:48px;margin-bottom:8px;}
.intro-title{font-size:var(--f-lg);font-weight:800;color:var(--tealD);line-height:1.35;letter-spacing:-.02em;margin-bottom:10px;}
.intro-text{font-size:var(--f-sm);color:var(--soft);line-height:1.65;}

.funnel{background:var(--card);border-radius:20px;padding:22px 20px;box-shadow:var(--sh-md);margin-top:18px;}
.fn-total{text-align:center;font-size:var(--f-sm);color:var(--soft);font-weight:700;margin-bottom:16px;}
.fn-total b{font-size:var(--f-xxl);color:var(--teal);display:block;letter-spacing:-.04em;line-height:1.1;}
.fn-row{display:flex;align-items:center;gap:14px;padding:16px 16px;border-radius:16px;margin-bottom:10px;border:2px solid;}
.fn-row.done{background:var(--doneBg);border-color:var(--doneLine);}
.fn-row.remain{background:var(--waitBg);border-color:var(--waitLine);}
.fn-num{font-size:var(--f-xl);font-weight:800;letter-spacing:-.04em;line-height:1;flex:0 0 auto;min-width:54px;text-align:center;}
.fn-row.done .fn-num{color:var(--done);} .fn-row.remain .fn-num{color:var(--wait);}
.fn-txt{flex:1;min-width:0;} .fn-lab{font-size:var(--f-md);font-weight:800;letter-spacing:-.01em;}
.fn-row.done .fn-lab{color:var(--done);} .fn-row.remain .fn-lab{color:var(--wait);}
.fn-sub{font-size:var(--f-xs);color:var(--soft);margin-top:4px;line-height:1.5;}
.fn-note{margin-top:6px;padding:12px 14px;background:#FCEAE7;border-radius:12px;font-size:var(--f-xs);color:#8A2A20;line-height:1.5;font-weight:600;}
.fn-recur{margin-top:6px;padding:12px 14px;background:var(--rejectBg);border:1.5px solid var(--rejectLine);border-radius:12px;font-size:var(--f-xs);color:var(--reject);line-height:1.5;font-weight:600;}

.prog-title{max-width:760px;margin:26px auto 8px;padding:0 20px;font-size:var(--f-md);font-weight:800;color:var(--text);}
.prog-list{max-width:760px;margin:0 auto;padding:0 18px 10px;}
.prog-row{width:100%;display:flex;align-items:center;gap:12px;background:var(--card);border:1.5px solid var(--line);border-radius:16px;padding:15px 16px;margin-bottom:10px;text-align:left;}
.prog-row:active{background:var(--bg);}
.prog-emoji{font-size:25px;flex:0 0 auto;}
.prog-name{flex:1;font-size:var(--f-sm);font-weight:800;min-width:0;}
.prog-badges{display:flex;gap:6px;flex:0 0 auto;}
.pb{font-size:14px;font-weight:800;border-radius:999px;padding:4px 11px;border:1.5px solid;}
.pb.done{background:var(--doneBg);color:var(--done);border-color:var(--doneLine);}
.pb.remain{background:var(--waitBg);color:var(--wait);border-color:var(--waitLine);}
.pb.zero{opacity:.35;}
.prog-caret{font-size:16px;color:var(--muted);flex:0 0 auto;}
.hint{max-width:760px;margin:8px auto 0;padding:16px 18px;border:2px dashed var(--tealLine);border-radius:14px;
  background:var(--tealBg);color:var(--tealD);font-size:var(--f-sm);font-weight:700;text-align:center;line-height:1.6;}

/* 공간/목록 */
.page-head{padding:22px 18px 6px;max-width:760px;margin:0 auto;}
.page-head .ph-loc{font-size:var(--f-xl);font-weight:800;letter-spacing:-.02em;display:flex;align-items:center;gap:10px;}
.page-head .ph-sub{font-size:var(--f-sm);color:var(--soft);margin-top:6px;}
.ph-sub b.done{color:var(--done);} .ph-sub b.wait{color:var(--wait);} .ph-sub b.reject{color:var(--reject);}
.section-desc{max-width:760px;margin:0 auto;padding:0 18px 6px;font-size:var(--f-xs);color:var(--muted);line-height:1.5;}
.list-sec{max-width:760px;margin:20px auto 2px;padding:0 20px;display:flex;align-items:center;gap:8px;font-size:var(--f-md);font-weight:800;}
.list-sec .c{font-size:var(--f-sm);color:var(--muted);font-weight:700;}
.list-sec.remain{color:var(--wait);} .list-sec.done{color:var(--done);}
.list{max-width:760px;margin:0 auto;padding:10px 18px 8px;}
.card{background:var(--card);border:1.5px solid var(--line);border-radius:20px;margin-bottom:14px;overflow:hidden;cursor:pointer;transition:transform .12s,box-shadow .12s;}
.card:active{transform:scale(.99);box-shadow:var(--sh-md);}
.card-photos{display:grid;grid-template-columns:1fr 1fr;gap:2px;background:var(--line);}
.card-photos.single{grid-template-columns:1fr;}
.card-photo{aspect-ratio:4/3;position:relative;background:#E8EEEC;}
.card-photos.single .card-photo{aspect-ratio:16/9;}
.card-photo img{width:100%;height:100%;object-fit:cover;display:block;}
.ba-label{position:absolute;top:8px;left:8px;padding:4px 12px;border-radius:8px;font-size:var(--f-xs);font-weight:800;color:#fff;}
.card-photo.before .ba-label{background:rgba(212,58,47,.92);}
.card-photo.after .ba-label{background:rgba(6,122,83,.92);}
.card-body{padding:16px 18px;}
.card-badges{display:flex;flex-wrap:wrap;gap:8px;align-items:center;}
.rlabel{font-size:14px;font-weight:800;color:var(--muted);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:3px 9px;}
.badge{font-size:var(--f-xs);font-weight:800;padding:5px 12px;border-radius:999px;display:inline-block;border:1.5px solid;}
.badge.done{background:var(--doneBg);color:var(--done);border-color:var(--doneLine);}
.badge.pending{background:var(--pendingBg);color:var(--pending);border-color:var(--pendingLine);}
.badge.reject{background:var(--rejectBg);color:var(--reject);border-color:var(--rejectLine);}
.badge.wait{background:var(--waitBg);color:var(--wait);border-color:var(--waitLine);}
.badge.recur{background:var(--rejectBg);color:var(--reject);border-color:var(--rejectLine);}
.verdict{display:inline-flex;align-items:center;gap:5px;font-size:var(--f-xs);font-weight:800;padding:5px 12px;border-radius:999px;border:1.5px solid;}
.verdict.ok{background:var(--doneBg);color:var(--done);border-color:var(--doneLine);}
.verdict.bad{background:#FCEAE7;color:var(--red);border-color:#F3B4AC;}
.verdict.unk{background:#F0F3F2;color:#55655F;border-color:#D8DFDC;}
.card-title{font-size:var(--f-md);font-weight:800;letter-spacing:-.02em;margin-top:10px;line-height:1.4;}
.card-ident{margin-top:10px;display:flex;flex-wrap:wrap;gap:6px;align-items:center;}
.chip{font-size:14px;font-weight:700;color:var(--soft);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:3px 10px;}
.chip.num{color:var(--teal);background:var(--tealBg);border-color:var(--tealLine);}
.card-date{font-size:var(--f-xs);color:var(--muted);margin-top:10px;font-weight:600;}

/* 상세 */
.detail-hero{background:linear-gradient(135deg,var(--teal),var(--tealD));color:#fff;padding:24px 20px 28px;}
.detail-hero .dh-wrap{max-width:760px;margin:0 auto;}
.detail-hero .rd{font-size:var(--f-xs);font-weight:700;color:rgba(255,255,255,.8);margin-bottom:6px;}
.detail-hero .loc{font-size:var(--f-xl);font-weight:800;letter-spacing:-.02em;display:flex;align-items:center;gap:10px;}
.detail-hero .desc{font-size:var(--f);color:rgba(255,255,255,.92);line-height:1.5;margin-top:8px;}
.builder-status{max-width:760px;margin:-16px auto 0;width:calc(100% - 36px);background:var(--card);
  border-radius:18px;padding:18px 20px;box-shadow:var(--sh-md);border-left:8px solid var(--line);}
.builder-status.done{border-left-color:var(--done);}
.builder-status.pending{border-left-color:var(--pending);}
.builder-status.reject{border-left-color:var(--reject);}
.builder-status.wait{border-left-color:var(--wait);}
.bs-label{font-size:var(--f-xs);font-weight:700;color:var(--muted);}
.bs-main{display:flex;align-items:center;gap:10px;margin-top:4px;}
.bs-ico{font-size:26px;line-height:1;}
.bs-title{font-size:var(--f-lg);font-weight:800;letter-spacing:-.02em;}
.builder-status.done .bs-title{color:var(--done);} .builder-status.pending .bs-title{color:var(--pending);}
.builder-status.reject .bs-title{color:var(--reject);} .builder-status.wait .bs-title{color:var(--wait);}
.bs-sub{font-size:var(--f-xs);color:var(--muted);margin-top:4px;font-weight:600;}
.bs-reply{margin-top:12px;padding:13px 15px;background:var(--bg);border-radius:12px;font-size:var(--f-sm);color:var(--text);line-height:1.6;}
.bs-reply .q{font-weight:800;color:var(--muted);font-size:var(--f-xs);display:block;margin-bottom:4px;}
.xref{max-width:760px;margin:14px auto 0;width:calc(100% - 36px);border:2px solid var(--tealLine);background:var(--tealBg);border-radius:16px;padding:16px 18px;}
.xref-h{font-size:var(--f-sm);font-weight:800;color:var(--tealD);margin-bottom:4px;}
.xref-note{font-size:var(--f-xs);color:var(--soft);margin-bottom:10px;line-height:1.5;}
.xref-item{display:flex;align-items:center;gap:8px;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);
  border-radius:11px;padding:12px 13px;margin-bottom:7px;font-size:var(--f-xs);color:var(--text);line-height:1.4;}
.xref-round{font-weight:800;color:#fff;background:var(--teal);border-radius:7px;padding:2px 9px;font-size:14px;flex:0 0 auto;}
.xref-txt{flex:1;min-width:0;}
.xref-st{font-size:13px;color:var(--muted);display:block;margin-top:2px;}
/* 🔁 1차→2차 변화 타임라인 */
.tl{max-width:760px;margin:14px auto 0;width:calc(100% - 36px);border:2px solid var(--rejectLine);background:var(--rejectBg);border-radius:16px;padding:16px 18px;}
.tl-h{font-size:var(--f-sm);font-weight:800;color:var(--reject);margin-bottom:4px;}
.tl-note{font-size:var(--f-xs);color:var(--soft);margin-bottom:12px;line-height:1.5;}
.tl-row{width:100%;display:flex;align-items:center;gap:10px;background:var(--card);border:1.5px solid var(--line);border-radius:12px;padding:10px 12px;text-align:left;}
.tl-row.cur{border-color:var(--reject);background:#fff;box-shadow:var(--sh-sm);}
.tl-row:not(.cur):active{background:var(--bg);}
.tl-round{font-weight:800;color:#fff;background:var(--soft);border-radius:7px;padding:3px 10px;font-size:14px;flex:0 0 auto;}
.tl-row.cur .tl-round{background:var(--reject);}
.tl-thumb{width:46px;height:46px;border-radius:8px;object-fit:cover;flex:0 0 auto;background:#E8EEEC;}
.tl-thumb.noimg{background:var(--bg);}
.tl-txt{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px;}
.tl-st{font-size:var(--f-xs);font-weight:800;}
.tl-st.done{color:var(--done);} .tl-st.reject{color:var(--reject);} .tl-st.pending{color:var(--pending);} .tl-st.wait{color:var(--wait);}
.tl-date{font-size:13px;color:var(--muted);}
.tl-here{font-size:13px;font-weight:800;color:var(--reject);flex:0 0 auto;}
.tl-go{font-size:18px;color:var(--muted);flex:0 0 auto;}
.tl-arrow{text-align:center;color:var(--reject);font-size:12px;line-height:1.3;margin:2px 0;}
.section-label{max-width:760px;margin:22px auto 0;padding:0 18px;font-size:var(--f-sm);font-weight:800;color:var(--text);}
.cmp-photos{max-width:760px;margin:10px auto 0;padding:0 18px;display:grid;grid-template-columns:1fr 1fr;gap:10px;align-items:start;}
.cmp-col{min-width:0;}
.cmp-col-h{font-size:var(--f-sm);font-weight:800;display:flex;align-items:center;justify-content:center;gap:6px;
  margin-bottom:10px;color:#fff;border-radius:10px;padding:9px 6px;}
.cmp-col.before .cmp-col-h{background:var(--red);}
.cmp-col.after .cmp-col-h{background:var(--done);}
.cmp-imgs{display:flex;flex-direction:column;gap:10px;}
.cmp-imgs img{width:100%;height:auto;border-radius:12px;box-shadow:var(--sh-sm);background:#E8EEEC;cursor:zoom-in;display:block;}
.cmp-single{max-width:760px;margin:10px auto 0;padding:0 18px;}
.cmp-single .cmp-col-h{background:var(--wait);}
.no-photo{padding:40px 20px;text-align:center;color:var(--muted);background:var(--bg);border-radius:16px;}
.ai-box{max-width:760px;margin:16px auto 0;width:calc(100% - 36px);border-radius:16px;padding:18px 20px;border:2px solid;}
.ai-box.ok{background:var(--doneBg);border-color:var(--doneLine);}
.ai-box.bad{background:#FCEAE7;border-color:#F3B4AC;}
.ai-box.unk{background:#F4F6F5;border-color:var(--line);}
.ai-h{font-size:var(--f-xs);font-weight:800;color:var(--soft);display:flex;align-items:center;gap:8px;margin-bottom:8px;}
.ai-tag{font-size:13px;font-weight:700;background:rgba(0,0,0,.06);color:var(--soft);border-radius:6px;padding:2px 9px;}
.ai-verdict{font-size:var(--f-md);font-weight:800;}
.ai-box.ok .ai-verdict{color:var(--done);} .ai-box.bad .ai-verdict{color:var(--red);} .ai-box.unk .ai-verdict{color:#46554F;}
.ai-reason{font-size:var(--f-sm);color:var(--text);margin-top:6px;line-height:1.55;}
.ai-disc{font-size:var(--f-xs);color:var(--muted);margin-top:10px;line-height:1.55;}
.ident-box{max-width:760px;margin:18px auto 0;padding:0 18px;}
.ident-box .ib-title{font-size:var(--f-xs);font-weight:700;color:var(--muted);margin-bottom:8px;}
.ident-chips{display:flex;flex-wrap:wrap;gap:8px;}
.ident-chips .chip{font-size:var(--f-xs);padding:6px 14px;}
.dl-link{display:flex;align-items:center;justify-content:center;gap:10px;max-width:760px;margin:16px auto 0;width:calc(100% - 36px);
  background:var(--teal);color:#fff;font-size:var(--f-sm);font-weight:800;text-decoration:none;padding:16px;border-radius:14px;box-shadow:var(--sh-sm);}
.dl-link:active{background:var(--tealD);}
.dl-hint{max-width:760px;margin:8px auto 0;padding:0 18px;font-size:14px;color:var(--muted);text-align:center;}
.modal{display:none;position:fixed;inset:0;z-index:200;background:rgba(0,0,0,.93);align-items:center;justify-content:center;padding:16px;padding-bottom:max(16px,env(safe-area-inset-bottom));}
.modal.active{display:flex;}
.modal img{max-width:100%;max-height:100%;border-radius:8px;}
.modal-close{position:absolute;top:max(16px,env(safe-area-inset-top));right:16px;width:50px;height:50px;background:rgba(255,255,255,.2);border:0;border-radius:50%;color:#fff;font-size:28px;display:flex;align-items:center;justify-content:center;}
.foot{max-width:760px;margin:0 auto;text-align:center;padding:34px 20px;font-size:var(--f-xs);color:var(--muted);line-height:1.8;}
.foot b{color:var(--soft);}
@media (max-width:919px){
  .sidebar{position:fixed;top:0;left:0;height:100vh;height:100dvh;width:88%;max-width:360px;z-index:130;
    transform:translateX(-100%);transition:transform .25s ease;
    padding-top:calc(14px + env(safe-area-inset-top));padding-bottom:calc(24px + env(safe-area-inset-bottom));box-shadow:var(--sh-lg);}
  .sidebar.open{transform:translateX(0);}
  .scrim{display:block;position:fixed;inset:0;z-index:120;background:rgba(0,0,0,.45);opacity:0;visibility:hidden;transition:opacity .25s;}
  .scrim.show{opacity:1;visibility:visible;}
}
@media (min-width:920px){ .btn-menu{display:none;} }
</style>
</head>
<body>

<header class="topbar">
  <button class="icon-btn btn-menu" id="btnMenu" aria-label="메뉴 열기">☰</button>
  <div class="titles">
    <div class="t1">신축 아파트 하자 보수 현황</div>
    <div class="t2">e편한세상 검단 웰카운티</div>
  </div>
  <button class="icon-btn" id="btnHome" aria-label="처음으로">🏠</button>
</header>

<div class="layout">
  <aside class="sidebar" id="sidebar"><nav id="nav"></nav></aside>
  <div class="scrim" id="scrim"></div>
  <main class="main" id="main"></main>
</div>

<div class="modal" id="modal" role="dialog" aria-modal="true" aria-label="사진 확대 보기">
  <button class="modal-close" id="modalClose" aria-label="사진 닫기">✕</button>
  <img id="modalImg" src="" alt="확대 사진">
</div>

<script src="data.js"></script>
<script src="verdicts.js"></script>
<script>
const THUMB = p => p.replace('images/', 'thumbs/');
const DLBASE = 'https://mobileas.dlenc.co.kr/dch7001/';
function fmtDate(d){ if(!d) return ''; const [y,m,day]=d.split('-'); return `${y}년 ${+m}월 ${+day}일`; }
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

/* 상태(건설사 처리) : done=수리완료 / pending=조치예정 / reject=하자아님 / wait=접수대기 */
const STATUS_META = {
  done:   {emoji:'✅', label:'수리 완료',         cls:'done'},
  pending:{emoji:'🏢', label:'건설사: 조치 예정', cls:'pending'},
  reject: {emoji:'🏢', label:'건설사: 하자 아님', cls:'reject'},
  wait:   {emoji:'🔧', label:'접수 · 대기',       cls:'wait'},
};
function statusOf(it){
  let key='wait';
  if(it.hasAfter) key='done';
  else if(it.dlReplyCat==='pending') key='pending';
  else if(it.dlReplyCat==='reject') key='reject';
  return { key, ...STATUS_META[key] };
}
const isDone = it => statusOf(it).key==='done';   // 물리적 수리 완료(사진 有)

/* AI 보수 판단 */
const VERDICT_META = {
  confirmed:    {emoji:'✅', label:'보수 확인',          cls:'ok',   desc:'보수 전·후 사진에서 결함이 해소된 것으로 보여요.'},
  suspect:      {emoji:'❗', label:'미보수 의심',        cls:'bad',  desc:'보수 후 사진에도 문제가 남아 있는 것으로 보여요. 직접 확인이 필요해요.'},
  unverifiable: {emoji:'❓', label:'사진으로 확인 어려움', cls:'unk',  desc:'기능 점검이 필요하거나, 사진만으로는 보수 여부를 판단하기 어려워요.'},
  no_after:     {emoji:'⬜', label:'보수 후 사진 없음',    cls:'unk',  desc:'작업 후 사진이 등록되지 않아 보수 여부를 확인할 수 없어요.'},
};
function verdictOf(sysno){
  const raw = (typeof VERDICTS!=='undefined' && VERDICTS[sysno]) || null;
  const key = (raw && raw.v) || 'no_after';
  const meta = VERDICT_META[key] || VERDICT_META.no_after;
  return { key, meta, reason:(raw && raw.r) || meta.desc };
}

/* 차수 필터: 'all' | 1 | 2 (기본 전체) */
let RFILTER='all';
function itemsF(){ return RFILTER==='all' ? ITEMS : ITEMS.filter(i=>i.round===RFILTER); }

/* 교차검증(1↔2차) — 수작업 검증한 재점검 매칭(XGROUPS) */
const RECUR={};                                  // sysno -> 같은 spot 전체 sysno(회차·접수일 순)
(typeof XGROUPS!=='undefined'?XGROUPS:[]).forEach(g=>{
  const order=g.map(sn=>ITEMS.find(i=>i.sysno===sn)).filter(Boolean)
    .sort((a,b)=>a.round-b.round || String(a.rcptDate).localeCompare(String(b.rcptDate)) || a.sysno.localeCompare(b.sysno))
    .map(i=>i.sysno);
  order.forEach(sn=>RECUR[sn]=order);
});
const isRecur = it => !!RECUR[it.sysno];         // 1·2차에 걸쳐 재접수된 곳
function recurGroup(it){ return (RECUR[it.sysno]||[]).map(sn=>ITEMS.find(i=>i.sysno===sn)); }

/* CSV */
function csvCell(s){ s=String(s==null?'':s); return /[",\n\r]/.test(s)? '"'+s.replace(/"/g,'""')+'"' : s; }
function exportCSV(items, filename){
  const head=['등록번호(DL)','차수','공간','부위','결함유형','내용','수리상태','건설사 답변','보수일','AI 판정','DL등급','DL링크'];
  const VL={confirmed:'보수 확인',suspect:'미보수 의심',unverifiable:'사진으로 확인 어려움',no_after:'보수후 사진 없음'};
  const rows=items.map(it=>{ const v=verdictOf(it.sysno);
    return [it.sysno,it.round+'차',it.loc,it.part,it.dtype,it.content,statusOf(it).label,it.dlReply||'',it.repairDate||'',VL[v.key]||v.key,it.grade||'',DLBASE+it.sysno].map(csvCell).join(','); });
  const csv='﻿'+[head.join(','),...rows].join('\r\n');
  const blob=new Blob([csv],{type:'text/csv;charset=utf-8;'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=filename;
  document.body.appendChild(a); a.click(); document.body.removeChild(a); URL.revokeObjectURL(a.href);
}

/* 공간별 그룹 (필터 적용 후 재계산) */
const HEAT='__HEAT__';
const LOC_META={ [HEAT]:{name:'바닥 난방 (전 공간)', emoji:'🔥'} };
function groupKeyOf(it){ return it.part==='분배기' ? HEAT : it.loc; }
function groupOf(it){ const m=LOC_META[groupKeyOf(it)]; return m ? m : {name:it.loc, emoji:it.emoji}; }
const stRank = it => ({wait:0, reject:1, pending:2, done:3}[statusOf(it).key]);
let LOCATIONS=[];
function buildLocations(){
  const map={};
  itemsF().forEach(it=>{ const k=groupKeyOf(it); (map[k]=map[k]||[]).push(it); });
  LOCATIONS=Object.keys(map).map(key=>{
    const items=map[key].slice().sort((a,b)=>{ const r=stRank(a)-stRank(b); return r||a.sysno.localeCompare(b.sysno); });
    const meta=LOC_META[key];
    const done=items.filter(isDone).length;
    return { loc:key, name:meta?meta.name:key, emoji:meta?meta.emoji:items[0].emoji, items, done, remain:items.length-done };
  }).sort((a,b)=>{ if(a.remain!==b.remain) return b.remain-a.remain; return b.items.length-a.items.length; }); // 남음 많은 곳 먼저
}
const locIdx = key => LOCATIONS.findIndex(L=>L.loc===key);

/* 남은 곳 = 미완료(수리 안 됨) */
function remainList(){
  return itemsF().filter(it=>!isDone(it)).sort((a,b)=>{ const r=stRank(a)-stRank(b); return r||a.sysno.localeCompare(b.sysno); });
}

/* ===== 사이드 메뉴 ===== */
function buildNav(){
  const rc={all:ITEMS.length, 1:ITEMS.filter(i=>i.round===1).length, 2:ITEMS.filter(i=>i.round===2).length};
  let h = `<div class="rfilter">
      <button class="rf ${RFILTER==='all'?'on':''}" onclick="setFilter('all')">전체 ${rc.all}</button>
      <button class="rf ${RFILTER===1?'on':''}" onclick="setFilter(1)">1차 ${rc[1]}</button>
      <button class="rf ${RFILTER===2?'on':''}" onclick="setFilter(2)">2차 ${rc[2]}</button>
    </div>
    <button class="nav-home" id="navHome" onclick="go('home')">📊 수리 현황</button>
    <button class="nav-need" id="navNeed" onclick="go('need')">🚩 아직 남은 곳 <span class="need-count">${remainList().length}</span></button>
    <div class="nav-sect">공간별 보기 (남음 많은 순)</div>`;
  LOCATIONS.forEach((L,i)=>{
    h += `<div class="nav-group" id="g${i}">
      <button class="nav-loc" onclick="navLoc(${i})" aria-expanded="false">
        <span class="nav-loc-name">${esc(L.emoji)} ${esc(L.name)}</span>
        <span class="nav-loc-meta">
          <span class="dot ${L.remain? 'wait':'done'}"></span>
          <span class="nav-count">${L.done}·${L.remain}</span>
          <span class="nav-caret">▾</span>
        </span>
      </button>
      <div class="nav-items">
        ${L.items.map(it=>`
          <button class="nav-item" id="ni${it.sysno}" onclick="go('item','${it.sysno}')">
            <span class="ni-status">${statusOf(it).emoji}</span>
            <span class="ni-text">
              <span class="ni-title">${esc(it.content)}</span>
              <span class="ni-label">${it.round}차 · ${esc(it.dtype)} · DL ${it.sysno}</span>
            </span>
          </button>`).join('')}
      </div>
    </div>`;
  });
  document.getElementById('nav').innerHTML = h;
}
function setFilter(f){ if(RFILTER===f) return; RFILTER=f; buildLocations(); buildNav(); go('home'); }
/* 드릴다운 토글 — 열린 공간을 다시 누르면 접힘(원복) */
function navLoc(i){
  const g=document.getElementById('g'+i);
  if(g && g.classList.contains('open')){
    g.classList.remove('open');
    const btn=g.querySelector('.nav-loc'); if(btn){ btn.classList.remove('active'); btn.setAttribute('aria-expanded','false'); }
  } else { go('loc', i); }
}

/* ===== 홈 = 수리 현황 ===== */
function viewHome(){
  const its=itemsF();
  const st={done:0,pending:0,reject:0,wait:0}; its.forEach(i=>st[statusOf(i).key]++);
  const remain=st.pending+st.reject+st.wait;
  const aiConfirmed=its.filter(i=>i.hasAfter && verdictOf(i.sysno).key==='confirmed').length;
  const aiSuspect=its.filter(i=>i.hasAfter && verdictOf(i.sysno).key==='suspect').length;
  const recurSpots=(typeof XGROUPS!=='undefined'?XGROUPS:[]).length;   // 1·2차 재접수 곳(모두 교차라운드)
  const fLabel = RFILTER==='all' ? '1차 + 2차 점검' : RFILTER+'차 점검';
  return `<div class="wrap">
    <div class="intro">
      <div class="intro-emoji">🏡</div>
      <div class="intro-title">우리 집 하자,<br>어디까지 고쳐졌나요?</div>
      <div class="intro-text">사전점검에서 발견한 하자를<br>건설사가 어디까지 수리했는지<br><b>공간별로 · 사진과 함께</b> 확인하세요.</div>
    </div>
    <div class="funnel">
      <div class="fn-total">${fLabel} 전체 하자<b>${its.length}건</b></div>
      <div class="fn-row done"><div class="fn-num">${st.done}</div><div class="fn-txt">
        <div class="fn-lab">✅ 수리 완료</div>
        <div class="fn-sub">건설사가 보수 후 사진 등록 · 🤖 AI 사진 재검증 통과 <b>${aiConfirmed}건</b></div></div></div>
      <div class="fn-row remain"><div class="fn-num">${remain}</div><div class="fn-txt">
        <div class="fn-lab">🚩 아직 남은 곳</div>
        <div class="fn-sub">🏢 조치 예정 ${st.pending} · 🏢 하자 아님 ${st.reject} · 🔧 접수 대기 ${st.wait}</div></div></div>
      ${aiSuspect? `<div class="fn-note">⚠️ '수리 완료' 중 <b>${aiSuspect}곳</b>은 AI가 <b>미보수 의심</b>으로 봤어요 — 재확인 권장</div>`:''}
      ${(RFILTER!==1 && recurSpots)? `<div class="fn-recur">🔁 1차에 처리됐다가 <b>2차에 다시 접수된 곳 ${recurSpots}곳</b> — 각 항목 상세에서 회차별 변화를 비교할 수 있어요</div>`:''}
      ${remain? `<button class="home-cta" onclick="go('need')">🚩 아직 남은 ${remain}곳 모아보기 →</button>`:''}
    </div>
    <div class="prog-title">📍 공간별 수리 현황</div>
    <div class="prog-list">${LOCATIONS.map((L,i)=>`
      <button class="prog-row" onclick="go('loc',${i})">
        <span class="prog-emoji">${esc(L.emoji)}</span>
        <span class="prog-name">${esc(L.name)}</span>
        <span class="prog-badges">
          <span class="pb done ${L.done?'':'zero'}">✅ ${L.done}</span>
          <span class="pb remain ${L.remain?'':'zero'}">🚩 ${L.remain}</span>
        </span>
        <span class="prog-caret">›</span>
      </button>`).join('')}</div>
    <div class="hint">위 <b>전체 / 1차 / 2차</b>로 나눠 볼 수 있어요.<br>공간을 누르면 완료·남은 항목이 나와요.</div>
    <div class="foot">
      <button class="csv-btn" onclick="exportCSV(ITEMS,'하자현황_전체${ITEMS.length}건.csv')">📄 전체(1·2차) CSV로 내보내기</button><br><br>
      <b>1차 점검</b> 2026년 5월 9~10일 · <b>2차 점검</b> 2026년 7월 2일<br>
      <b>시공사</b> DL이앤씨 · e편한세상 검단 웰카운티<br>
      사진을 누르면 크게 볼 수 있어요
    </div>
  </div>`;
}

function makeCard(it){
  const S=statusOf(it), V=verdictOf(it.sysno), repaired=it.hasAfter;
  let photos='';
  if(repaired && it.before.length && it.after.length){
    photos=`<div class="card-photos">
      <div class="card-photo before"><img loading="lazy" src="${THUMB(it.before[0])}" alt="보수 전 사진"><span class="ba-label">전</span></div>
      <div class="card-photo after"><img loading="lazy" src="${THUMB(it.after[0])}" alt="보수 후 사진"><span class="ba-label">후</span></div></div>`;
  } else if(it.before.length){
    photos=`<div class="card-photos single"><div class="card-photo before"><img loading="lazy" src="${THUMB(it.before[0])}" alt="현재 사진"><span class="ba-label">현재</span></div></div>`;
  }
  const aiBadge=(V.key!=='no_after')?`<span class="verdict ${V.meta.cls}">🤖 ${V.meta.label}</span>`:'';
  const dateTxt = repaired && it.repairDate ? `🗓 ${fmtDate(it.repairDate)} 보수`
    : S.key==='reject' ? '🏢 건설사: 하자 아님으로 답변'
    : S.key==='pending' ? '🏢 건설사: 입주 전 조치 예정'
    : '🔧 접수 · 처리 대기';
  return `<div class="card" role="button" tabindex="0" onclick="go('item','${it.sysno}')">
    ${photos}
    <div class="card-body">
      <div class="card-badges"><span class="rlabel">${it.round}차</span><span class="badge ${S.cls}">${S.emoji} ${S.label}</span>${aiBadge}${isRecur(it)?'<span class="badge recur">🔁 재점검</span>':''}</div>
      <div class="card-title">${esc(it.content)}</div>
      <div class="card-ident"><span class="chip">${esc(it.dtype)}</span><span class="chip num">DL ${it.sysno}</span></div>
      <div class="card-date">${dateTxt}</div>
    </div></div>`;
}

function viewLoc(i){
  const L=LOCATIONS[i]; if(!L) return viewHome();
  const remain=L.items.filter(it=>!isDone(it)), done=L.items.filter(isDone);
  const sec=(title,cls,arr)=> arr.length? `<div class="list-sec ${cls}">${title}<span class="c">${arr.length}곳</span></div><div class="list">${arr.map(makeCard).join('')}</div>`:'';
  return `<div class="page-head">
      <div class="ph-loc">${esc(L.emoji)} ${esc(L.name)}</div>
      <div class="ph-sub">전체 ${L.items.length}곳 · <b class="done">수리 완료 ${done.length}</b> · <b class="wait">남음 ${remain.length}</b></div>
    </div>
    ${sec('🚩 아직 남은 곳','remain',remain)}
    ${sec('✅ 수리 완료','done',done)}`;
}

function viewNeed(){
  const items=remainList();
  const c={wait:0,reject:0,pending:0}; items.forEach(i=>c[statusOf(i).key]++);
  return `<div class="page-head">
      <div class="ph-loc">🚩 아직 남은 곳</div>
      <div class="ph-sub">${RFILTER==='all'?'전체':RFILTER+'차'} · ${items.length}곳 · <b class="wait">접수 대기 ${c.wait}</b> · <b class="reject">하자 아님 ${c.reject}</b> · 조치 예정 ${c.pending}</div>
    </div>
    <div class="section-desc">아직 수리되지 않았거나, 건설사가 '하자 아님/조치 예정'으로 답변한 항목이에요. 직접 점검하거나 재요청·재이의가 필요할 수 있어요.</div>
    <div style="max-width:760px;margin:0 auto;padding:0 18px 10px;"><button class="csv-btn" onclick="exportCSV(remainList(),'하자현황_남은곳${items.length}건.csv')">📄 이 목록 CSV로 내보내기</button></div>
    <div class="list">${items.map(makeCard).join('')}</div>`;
}

function viewItem(sysno){
  const it=ITEMS.find(x=>x.sysno===sysno); if(!it) return viewHome();
  const S=statusOf(it), V=verdictOf(sysno), repaired=it.hasAfter;
  const bsSub = S.key==='done' ? `${fmtDate(it.repairDate)} 보수 등록` : S.key==='wait' ? '아직 접수 상태 — 건설사 처리(보수/답변) 전이에요' : '';
  const builder = `<div class="builder-status ${S.cls}">
      <div class="bs-label">건설사(DL이앤씨) 처리 상태</div>
      <div class="bs-main"><span class="bs-ico">${S.emoji}</span><span class="bs-title">${S.label}</span></div>
      ${bsSub?`<div class="bs-sub">${bsSub}</div>`:''}
      ${it.dlReply?`<div class="bs-reply"><span class="q">건설사 답변</span>“${esc(it.dlReply)}”</div>`:''}
    </div>`;
  const grp=recurGroup(it);
  let timeline='';
  if(grp.length>1){
    const disputed=grp.some(o=>o.round===1 && (o.hasAfter||o.dlReplyCat==='reject'));
    const rows=grp.map(o=>{
      const so=statusOf(o), cur=o.sysno===it.sysno;
      const th=(o.hasAfter&&o.after[0])?THUMB(o.after[0]):(o.before[0]?THUMB(o.before[0]):'');
      return `<button class="tl-row ${cur?'cur':''}" ${cur?'disabled':''} onclick="goItem('${o.sysno}')">
        <span class="tl-round">${o.round}차</span>
        ${th?`<img class="tl-thumb" loading="lazy" src="${th}" alt="">`:'<span class="tl-thumb noimg"></span>'}
        <span class="tl-txt"><span class="tl-st ${so.cls}">${so.emoji} ${so.label}</span>
          <span class="tl-date">${fmtDate(o.rcptDate)} 접수${o.hasAfter&&o.repairDate?` · ${fmtDate(o.repairDate)} 보수`:''}</span></span>
        ${cur?'<span class="tl-here">지금</span>':'<span class="tl-go">›</span>'}
      </button>`;
    }).join('<div class="tl-arrow">▼</div>');
    timeline=`<div class="tl">
      <div class="tl-h">🔁 1차 → 2차 변화 (같은 곳 재점검)</div>
      <div class="tl-note">${disputed?"1차에 <b>수리 완료·하자 아님</b>으로 처리됐는데 <b>2차에 다시 접수</b>된 곳이에요. 회차별 사진·상태를 비교해 보세요.":"같은 곳이 1·2차에 걸쳐 접수됐어요. 회차별로 비교해 보세요."}</div>
      ${rows}
    </div>`;
  }
  let photos='';
  if(repaired){
    photos=`<div class="section-label">📷 보수 전 · 후 사진 (좌우 비교)</div>
      <div class="cmp-photos">
        <div class="cmp-col before"><div class="cmp-col-h">◀ 보수 전</div>
          <div class="cmp-imgs">${it.before.map(s=>`<img src="${THUMB(s)}" loading="lazy" onclick="openModal('${s}')" alt="보수 전">`).join('')}</div></div>
        <div class="cmp-col after"><div class="cmp-col-h">보수 후 ▶</div>
          <div class="cmp-imgs">${it.after.map(s=>`<img src="${THUMB(s)}" loading="lazy" onclick="openModal('${s}')" alt="보수 후">`).join('')}</div></div>
      </div>`;
  } else {
    photos=`<div class="section-label">📷 현재 사진 (${it.round}차 점검)</div>
      <div class="cmp-single"><div class="cmp-col"><div class="cmp-col-h">현재 모습</div>
        <div class="cmp-imgs">${it.before.length? it.before.map(s=>`<img src="${THUMB(s)}" loading="lazy" onclick="openModal('${s}')" alt="현재">`).join('') : '<div class="no-photo">사진이 없습니다</div>'}</div></div></div>`;
  }
  const ai = repaired ? `<div class="ai-box ${V.meta.cls}">
      <div class="ai-h">🤖 AI 보수 판단 <span class="ai-tag">참고용</span></div>
      <div class="ai-verdict">${V.meta.emoji} ${V.meta.label}</div>
      <div class="ai-reason">${esc(V.reason)}</div>
      <div class="ai-disc">AI가 보수 전·후 사진을 비교한 추정이에요. '증거'가 아니라 재점검 체크용이며, 최종 확인은 직접 점검을 권장해요.</div>
    </div>` : '';
  const identDL=`<div class="ident-box">
      <div class="ib-title">식별 정보</div>
      <div class="ident-chips"><span class="chip">${it.round}차 점검</span><span class="chip">${esc(it.loc)}</span><span class="chip">${esc(it.dtype)}</span><span class="chip num">DL번호 ${it.sysno}</span></div>
    </div>
    <a class="dl-link" href="${DLBASE}${it.sysno}" target="_blank" rel="noopener">🔧 DL 보수시스템에서 열기 · 수정 →</a>
    <div class="dl-hint">건설사 보수 시스템(로그인 필요)에서 이 항목을 바로 확인·수정할 수 있어요</div>`;
  const G=groupOf(it);
  return `<button class="detail-back" onclick="go('loc',${locIdx(groupKeyOf(it))})">← 목록으로</button>
    <div class="detail-hero"><div class="dh-wrap">
      <div class="rd">${it.round}차 점검 · ${fmtDate(it.rcptDate)} 접수</div>
      <div class="loc">${esc(G.emoji)} ${esc(G.name)}</div>
      <div class="desc">${esc(it.content)}</div>
    </div></div>
    ${builder}
    ${timeline}
    ${photos}
    ${ai}
    ${identDL}
    <div class="foot">사진을 누르면 원본 화질로 크게 볼 수 있어요</div>`;
}

/* ===== 라우팅 ===== */
function setActive(view, arg){
  document.querySelectorAll('.nav-loc.active, .nav-item.active').forEach(e=>e.classList.remove('active'));
  const nh=document.getElementById('navHome'), nn=document.getElementById('navNeed');
  if(nh) nh.classList.toggle('active', view==='home');
  if(nn) nn.classList.toggle('active', view==='need');
  if(view==='loc'){ const g=document.getElementById('g'+arg); if(g){ openGroup(arg); g.querySelector('.nav-loc').classList.add('active'); } }
  if(view==='item'){
    const it=ITEMS.find(x=>x.sysno===arg);
    if(it){ const i=locIdx(groupKeyOf(it)); openGroup(i);
      const g=document.getElementById('g'+i); if(g) g.querySelector('.nav-loc').classList.add('active');
      const ni=document.getElementById('ni'+arg); if(ni) ni.classList.add('active');
    }
  }
}
function openGroup(i){
  LOCATIONS.forEach((_,j)=>{ const g=document.getElementById('g'+j); if(!g) return; const open=(j===i);
    g.classList.toggle('open', open); const btn=g.querySelector('.nav-loc'); if(btn) btn.setAttribute('aria-expanded', open?'true':'false'); });
}
function render(){
  document.getElementById('modal').classList.remove('active');
  const h=location.hash.slice(1), main=document.getElementById('main');
  let view='home', arg=null;
  if(h.startsWith('loc/')){ view='loc'; arg=parseInt(h.slice(4),10); }
  else if(h.startsWith('item/')){ view='item'; arg=h.slice(5); }
  else if(h==='need'){ view='need'; }
  if(view==='loc' && LOCATIONS[arg]) main.innerHTML=viewLoc(arg);
  else if(view==='item' && ITEMS.find(x=>x.sysno===arg)) main.innerHTML=viewItem(arg);
  else if(view==='need') main.innerHTML=viewNeed();
  else { view='home'; main.innerHTML=viewHome(); }
  setActive(view, arg);
  window.scrollTo(0,0);
}
function go(view, arg){
  closeDrawer();
  const prev=location.hash;
  if(view==='home') location.hash='';
  else if(view==='need') location.hash='need';
  else if(view==='loc') location.hash='loc/'+arg;
  else if(view==='item') location.hash='item/'+arg;
  if(location.hash===prev) render();
}
function goItem(sysno){                            // 교차검증 링크 (필터 무관하게 열기)
  const it=ITEMS.find(x=>x.sysno===sysno); if(!it) return;
  if(RFILTER!=='all' && RFILTER!==it.round){ RFILTER='all'; buildLocations(); buildNav(); }
  go('item', sysno);
}
window.addEventListener('hashchange', render);

/* 드로어 */
function openDrawer(){ document.getElementById('sidebar').classList.add('open'); document.getElementById('scrim').classList.add('show'); }
function closeDrawer(){ document.getElementById('sidebar').classList.remove('open'); document.getElementById('scrim').classList.remove('show'); }
document.getElementById('btnMenu').addEventListener('click', openDrawer);
document.getElementById('scrim').addEventListener('click', closeDrawer);
document.getElementById('btnHome').addEventListener('click', ()=>go('home'));

/* 모달 */
function openModal(src){ document.getElementById('modalImg').src=src; document.getElementById('modal').classList.add('active'); document.getElementById('modalClose').focus(); }
document.getElementById('modalClose').addEventListener('click', ()=>document.getElementById('modal').classList.remove('active'));
document.getElementById('modal').addEventListener('click', e=>{ if(e.target.id==='modal') document.getElementById('modal').classList.remove('active'); });
document.addEventListener('keydown', e=>{
  if(e.key==='Escape'){ document.getElementById('modal').classList.remove('active'); closeDrawer(); }
  else if((e.key==='Enter'||e.key===' ') && document.activeElement && document.activeElement.classList && document.activeElement.classList.contains('card')){
    e.preventDefault(); document.activeElement.click();
  }
});

buildLocations();
buildNav();
render();
</script>
</body>
</html>
