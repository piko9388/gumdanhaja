<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
<meta name="theme-color" content="#0F766E">
<title>검단 이편한세상 웰카운티 하자 보수 현황</title>
<meta property="og:title" content="검단 이편한세상 웰카운티 하자 보수 현황">
<meta property="og:description" content="우리 집 하자 보수 전/후를 공간별로 확인하세요">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F4F6F5; --card:#FFFFFF; --text:#16241F; --soft:#46554F; --muted:#7E8C87;
  --line:#E4EAE7; --teal:#0F766E; --tealD:#0B5F58; --tealBg:#ECFBF7; --tealLine:#A7F3D6;
  --done:#067A53; --doneBg:#E9FBF2; --doneLine:#7BE0B4;
  --wait:#C26A05; --waitBg:#FFF6E8; --waitLine:#FBD491;
  --red:#D43A2F;
  --sh-sm:0 1px 3px rgba(0,0,0,.05); --sh-md:0 4px 14px rgba(0,0,0,.07); --sh-lg:0 14px 34px rgba(0,0,0,.14);
  --f-xs:16px; --f-sm:18px; --f:20px; --f-md:23px; --f-lg:27px; --f-xl:32px; --f-xxl:42px;
  --hdr:66px; --side:340px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html{font-size:16px;}
body{
  font-family:'Gowun Dodum','Apple SD Gothic Neo','Malgun Gothic',sans-serif;
  background:var(--bg); color:var(--text); line-height:1.6; font-size:var(--f);
  -webkit-font-smoothing:antialiased;
}
button{font-family:inherit;cursor:pointer;}

/* ===== 상단바 ===== */
.topbar{
  position:sticky; top:0; z-index:100; height:var(--hdr);
  background:linear-gradient(135deg,var(--teal),var(--tealD)); color:#fff;
  display:flex; align-items:center; gap:12px; padding:0 16px;
  padding-top:env(safe-area-inset-top); box-shadow:var(--sh-md);
}
.icon-btn{
  width:50px;height:50px;flex:0 0 50px; border:0; border-radius:14px;
  background:rgba(255,255,255,.16); color:#fff; font-size:26px;
  display:flex;align-items:center;justify-content:center;
}
.icon-btn:active{background:rgba(255,255,255,.3);}
.titles{flex:1;min-width:0;}
.t1{font-size:var(--f-md);font-weight:800;letter-spacing:-.02em;line-height:1.25;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.t2{font-size:var(--f-xs);color:rgba(255,255,255,.85);margin-top:2px;}

/* ===== 레이아웃 ===== */
.layout{display:flex;align-items:flex-start;}
.sidebar{
  flex:0 0 var(--side); width:var(--side);
  position:sticky; top:var(--hdr); height:calc(100vh - var(--hdr));
  overflow-y:auto; background:var(--card); border-right:1px solid var(--line);
  padding:14px 12px 40px;
}
.scrim{display:none;}
.main{flex:1 1 auto;min-width:0;padding:0 0 60px;}

/* ===== 사이드 메뉴 ===== */
.nav-home{
  width:100%; text-align:left; border:2px solid var(--tealLine);
  background:var(--tealBg); color:var(--tealD); font-weight:800;
  font-size:var(--f-sm); padding:16px 16px; border-radius:14px; margin-bottom:14px;
  display:flex;align-items:center;gap:10px;
}
.nav-home.active{background:var(--teal);color:#fff;border-color:var(--teal);}
.nav-sect{font-size:var(--f-xs);font-weight:700;color:var(--muted);
  padding:4px 8px 8px;letter-spacing:.02em;}
.nav-group{border-bottom:1px solid var(--line);}
.nav-loc{
  width:100%;display:flex;align-items:center;gap:8px;
  background:none;border:0;padding:15px 8px;font-size:var(--f-sm);font-weight:700;
  color:var(--text);text-align:left;border-radius:10px;
}
.nav-loc:active{background:var(--bg);}
.nav-loc.active{color:var(--tealD);}
.nav-loc-name{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.nav-loc-meta{display:flex;align-items:center;gap:8px;flex:0 0 auto;}
.dot{width:11px;height:11px;border-radius:50%;display:inline-block;}
.dot.done{background:var(--done);} .dot.wait{background:var(--wait);}
.nav-count{font-size:var(--f-xs);font-weight:800;color:var(--muted);
  background:var(--bg);border-radius:999px;padding:2px 10px;min-width:34px;text-align:center;}
.nav-caret{font-size:15px;color:var(--muted);transition:transform .2s;}
.nav-group.open .nav-caret{transform:rotate(180deg);}
.nav-items{display:none;padding:2px 0 12px;}
.nav-group.open .nav-items{display:block;}
.nav-item{
  width:100%;display:flex;align-items:flex-start;gap:10px;
  background:none;border:0;text-align:left;padding:11px 10px 11px 14px;
  border-left:3px solid transparent;border-radius:0 10px 10px 0;
}
.nav-item:active{background:var(--bg);}
.nav-item.active{background:var(--tealBg);border-left-color:var(--teal);}
.ni-status{font-size:18px;flex:0 0 auto;line-height:1.4;}
.ni-text{min-width:0;}
.ni-title{display:block;font-size:var(--f-xs);font-weight:700;color:var(--text);line-height:1.35;}
.ni-label{display:block;font-size:14px;color:var(--muted);margin-top:2px;}

/* ===== 홈 ===== */
.wrap{max-width:760px;margin:0 auto;padding:18px;}
.intro{background:var(--card);border-radius:22px;padding:28px 24px;box-shadow:var(--sh-md);text-align:center;}
.intro-emoji{font-size:50px;margin-bottom:10px;}
.intro-title{font-size:var(--f-lg);font-weight:800;color:var(--tealD);line-height:1.35;letter-spacing:-.02em;margin-bottom:14px;}
.intro-text{font-size:var(--f);color:var(--soft);line-height:1.7;}
.intro-text b{color:var(--done);font-weight:800;}

.stats{background:var(--card);border-radius:20px;padding:24px 20px;box-shadow:var(--sh-md);margin-top:18px;}
.stats-title{font-size:var(--f-sm);font-weight:700;color:var(--soft);text-align:center;margin-bottom:16px;}
.stats-row{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;text-align:center;}
.stat{padding:16px 6px;border-radius:14px;border:2px solid;}
.stat.total{background:var(--tealBg);border-color:var(--tealLine);}
.stat.done{background:var(--doneBg);border-color:var(--doneLine);}
.stat.wait{background:var(--waitBg);border-color:var(--waitLine);}
.stat-num{font-size:var(--f-xl);font-weight:800;line-height:1;letter-spacing:-.04em;}
.stat.total .stat-num{color:var(--teal);} .stat.done .stat-num{color:var(--done);} .stat.wait .stat-num{color:var(--wait);}
.stat-label{font-size:var(--f-xs);font-weight:700;color:var(--soft);margin-top:6px;line-height:1.3;}
.compare{display:flex;align-items:stretch;gap:8px;margin-top:16px;}
.cmp{flex:1;border:2px solid var(--line);border-radius:14px;padding:14px 8px;text-align:center;background:var(--bg);}
.cmp.sys{border-color:var(--tealLine);background:var(--tealBg);}
.cmp.photo{border-color:var(--doneLine);background:var(--doneBg);}
.cmp-num{font-size:var(--f-lg);font-weight:800;line-height:1;}
.cmp.sys .cmp-num{color:var(--teal);} .cmp.photo .cmp-num{color:var(--done);}
.cmp-label{font-size:var(--f-xs);font-weight:700;color:var(--soft);margin-top:6px;line-height:1.3;}
.cmp-arrow{display:flex;align-items:center;justify-content:center;font-size:26px;color:var(--muted);font-weight:700;}
.note{margin-top:14px;padding:14px 16px;background:var(--bg);border-radius:12px;font-size:var(--f-xs);color:var(--soft);line-height:1.6;}
.note b{color:var(--done);font-weight:800;}
.hint{margin-top:16px;padding:16px 18px;border:2px dashed var(--tealLine);border-radius:14px;
  background:var(--tealBg);color:var(--tealD);font-size:var(--f-sm);font-weight:700;text-align:center;line-height:1.6;}

/* ===== 공간/상세 공통 ===== */
.page-head{padding:22px 18px 6px;max-width:760px;margin:0 auto;}
.page-head .ph-loc{font-size:var(--f-xl);font-weight:800;letter-spacing:-.02em;display:flex;align-items:center;gap:10px;}
.page-head .ph-sub{font-size:var(--f-sm);color:var(--soft);margin-top:6px;}
.ph-sub b.done{color:var(--done);} .ph-sub b.wait{color:var(--wait);}

.list{max-width:760px;margin:0 auto;padding:12px 18px 20px;}
.card{background:var(--card);border:1.5px solid var(--line);border-radius:20px;margin-bottom:14px;overflow:hidden;cursor:pointer;transition:transform .12s,box-shadow .12s;}
.card:active{transform:scale(.99);box-shadow:var(--sh-md);}
.card-photos{display:grid;grid-template-columns:1fr 1fr;gap:2px;background:var(--line);}
.card-photos.single{grid-template-columns:1fr;}
.card-photo{aspect-ratio:4/3;position:relative;background:#E8EEEC;}
.card-photos.single .card-photo{aspect-ratio:16/9;}
.card-photo img{width:100%;height:100%;object-fit:cover;display:block;}
.ba-label{position:absolute;top:8px;left:8px;padding:4px 12px;border-radius:8px;font-size:var(--f-xs);font-weight:800;color:#fff;}
.card-photo.before .ba-label{background:rgba(212,58,47,.92);}
.card-photo.after .ba-label{background:rgba(6,122,83,.92);}
.card-body{padding:16px 18px;}
.badge{font-size:var(--f-xs);font-weight:800;padding:5px 12px;border-radius:999px;display:inline-block;}
.badge.done{background:var(--doneBg);color:var(--done);border:1.5px solid var(--doneLine);}
.badge.wait{background:var(--waitBg);color:var(--wait);border:1.5px solid var(--waitLine);}
.card-title{font-size:var(--f-md);font-weight:800;letter-spacing:-.02em;margin-top:10px;line-height:1.4;}
.card-ident{margin-top:10px;display:flex;flex-wrap:wrap;gap:6px;align-items:center;}
.chip{font-size:14px;font-weight:700;color:var(--soft);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:3px 10px;}
.chip.num{color:var(--teal);background:var(--tealBg);border-color:var(--tealLine);}
.card-date{font-size:var(--f-xs);color:var(--muted);margin-top:10px;font-weight:600;}

/* ===== 상세 ===== */
.detail-hero{background:linear-gradient(135deg,var(--teal),var(--tealD));color:#fff;padding:24px 20px 28px;}
.detail-hero .dh-wrap{max-width:760px;margin:0 auto;}
.detail-hero .loc{font-size:var(--f-xl);font-weight:800;letter-spacing:-.02em;display:flex;align-items:center;gap:10px;}
.detail-hero .desc{font-size:var(--f);color:rgba(255,255,255,.92);line-height:1.5;margin-top:8px;}
.detail-status{max-width:760px;margin:-16px auto 0;background:var(--card);border-radius:18px;padding:18px 20px;box-shadow:var(--sh-md);display:flex;align-items:center;gap:14px;width:calc(100% - 36px);}
.ds-icon{width:54px;height:54px;border-radius:16px;display:flex;align-items:center;justify-content:center;font-size:28px;flex:0 0 auto;}
.detail-status.done .ds-icon{background:var(--doneBg);} .detail-status.wait .ds-icon{background:var(--waitBg);}
.ds-title{font-size:var(--f-md);font-weight:800;}
.detail-status.done .ds-title{color:var(--done);} .detail-status.wait .ds-title{color:var(--wait);}
.ds-sub{font-size:var(--f-xs);color:var(--muted);margin-top:2px;font-weight:600;}

.ident-box{max-width:760px;margin:18px auto 0;padding:0 18px;}
.ident-box .ib-title{font-size:var(--f-xs);font-weight:700;color:var(--muted);margin-bottom:8px;}
.ident-chips{display:flex;flex-wrap:wrap;gap:8px;}
.ident-chips .chip{font-size:var(--f-xs);padding:6px 14px;}
.dl-link{display:flex;align-items:center;justify-content:center;gap:10px;max-width:760px;margin:16px auto 0;width:calc(100% - 36px);
  background:var(--teal);color:#fff;font-size:var(--f-sm);font-weight:800;text-decoration:none;
  padding:16px;border-radius:14px;box-shadow:var(--sh-sm);}
.dl-link:active{background:var(--tealD);}
.dl-hint{max-width:760px;margin:8px auto 0;padding:0 18px;font-size:14px;color:var(--muted);text-align:center;}

.photos{max-width:760px;margin:0 auto;padding:24px 18px 0;}
.pblock{margin-bottom:24px;}
.pblock-title{font-size:var(--f-md);font-weight:800;display:flex;align-items:center;gap:10px;margin-bottom:12px;letter-spacing:-.02em;}
.pblock-title .tag{padding:5px 14px;border-radius:10px;font-size:var(--f-sm);color:#fff;font-weight:800;}
.pblock.before .tag{background:var(--red);} .pblock.after .tag{background:var(--done);}
.pgrid{display:flex;flex-direction:column;gap:12px;}
.pgrid img{width:100%;height:auto;border-radius:16px;box-shadow:var(--sh-sm);background:#E8EEEC;cursor:zoom-in;}
.arrow{text-align:center;font-size:38px;color:var(--teal);margin:6px 0 18px;}
.wait-notice{max-width:760px;margin:0 auto;padding:20px;}
.wait-notice .wn-in{background:var(--waitBg);border:2px solid var(--waitLine);border-radius:16px;padding:18px 20px;font-size:var(--f-sm);line-height:1.6;color:#7A4408;}
.wait-notice b{display:block;font-weight:800;margin-bottom:6px;font-size:var(--f);}
.no-photo{padding:46px 20px;text-align:center;color:var(--muted);background:var(--bg);border-radius:16px;}

/* ===== 모달 ===== */
.modal{display:none;position:fixed;inset:0;z-index:200;background:rgba(0,0,0,.93);align-items:center;justify-content:center;padding:16px;}
.modal.active{display:flex;}
.modal img{max-width:100%;max-height:100%;border-radius:8px;}
.modal-close{position:absolute;top:max(16px,env(safe-area-inset-top));right:16px;width:50px;height:50px;background:rgba(255,255,255,.2);border:0;border-radius:50%;color:#fff;font-size:28px;display:flex;align-items:center;justify-content:center;}

.foot{max-width:760px;margin:0 auto;text-align:center;padding:34px 20px;font-size:var(--f-xs);color:var(--muted);line-height:1.8;}
.foot b{color:var(--soft);}

/* ===== 모바일 ===== */
@media (max-width:919px){
  .sidebar{
    position:fixed;top:0;left:0;height:100vh;width:88%;max-width:360px;z-index:130;
    transform:translateX(-100%);transition:transform .25s ease;
    padding-top:calc(14px + env(safe-area-inset-top));box-shadow:var(--sh-lg);
  }
  .sidebar.open{transform:translateX(0);}
  .scrim{display:block;position:fixed;inset:0;z-index:120;background:rgba(0,0,0,.45);opacity:0;visibility:hidden;transition:opacity .25s;}
  .scrim.show{opacity:1;visibility:visible;}
}
@media (min-width:920px){
  .btn-menu{display:none;}
}
</style>
</head>
<body>

<header class="topbar">
  <button class="icon-btn btn-menu" id="btnMenu" aria-label="공간 메뉴 열기">☰</button>
  <div class="titles">
    <div class="t1">검단 이편한세상 웰카운티 하자 보수 현황</div>
    <div class="t2">0111동 605호</div>
  </div>
  <button class="icon-btn" id="btnHome" aria-label="처음으로">🏠</button>
</header>

<div class="layout">
  <aside class="sidebar" id="sidebar"><nav id="nav"></nav></aside>
  <div class="scrim" id="scrim"></div>
  <main class="main" id="main"></main>
</div>

<div class="modal" id="modal">
  <button class="modal-close" id="modalClose">✕</button>
  <img id="modalImg" src="" alt="확대 사진">
</div>

<script src="data.js"></script>
<script>
const THUMB = p => p.replace('images/', 'thumbs/');
const DLBASE = 'https://mobileas.dlenc.co.kr/dch7001/';
function fmtDate(d){ if(!d) return ''; const [y,m,day]=d.split('-'); return `${y}년 ${+m}월 ${+day}일`; }
function esc(s){ return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

/* 공간별 그룹 (건수 많은 순). 각 공간 내부는 준비중 먼저, 그다음 등록순 */
const LOC_MAP={};
ITEMS.forEach(it=>{ (LOC_MAP[it.loc]=LOC_MAP[it.loc]||[]).push(it); });
const LOCATIONS=Object.keys(LOC_MAP).map(loc=>{
  const items=LOC_MAP[loc].slice().sort((a,b)=>{
    const ad=a.hasAfter?1:0, bd=b.hasAfter?1:0;
    if(ad!==bd) return ad-bd;            // 준비중(0) 먼저
    return a.sysno.localeCompare(b.sysno);
  });
  return { loc, emoji:items[0].emoji, items,
           done:items.filter(i=>i.hasAfter).length,
           wait:items.filter(i=>!i.hasAfter).length };
}).sort((a,b)=>b.items.length-a.items.length);
const locIdx = loc => LOCATIONS.findIndex(L=>L.loc===loc);

/* ===== 사이드 메뉴 ===== */
function buildNav(){
  let h = `<button class="nav-home" id="navHome" onclick="go('home')">🏠 전체 현황</button>
           <div class="nav-sect">공간별 보기</div>`;
  LOCATIONS.forEach((L,i)=>{
    h += `<div class="nav-group" id="g${i}">
      <button class="nav-loc" onclick="go('loc',${i})">
        <span class="nav-loc-name">${esc(L.emoji)} ${esc(L.loc)}</span>
        <span class="nav-loc-meta">
          <span class="dot ${L.wait? 'wait':'done'}"></span>
          <span class="nav-count">${L.items.length}</span>
          <span class="nav-caret">▾</span>
        </span>
      </button>
      <div class="nav-items">
        ${L.items.map(it=>`
          <button class="nav-item" id="ni${it.sysno}" onclick="go('item','${it.sysno}')">
            <span class="ni-status">${it.hasAfter? '✅':'🔧'}</span>
            <span class="ni-text">
              <span class="ni-title">${esc(it.content)}</span>
              <span class="ni-label">${esc(it.part)} · ${esc(it.dtype)} · DL ${it.sysno}</span>
            </span>
          </button>`).join('')}
      </div>
    </div>`;
  });
  document.getElementById('nav').innerHTML = h;
}

/* ===== 메인 화면들 ===== */
function viewHome(){
  return `<div class="wrap">
    <div class="intro">
      <div class="intro-emoji">🏡</div>
      <div class="intro-title">검단 이편한세상 웰카운티<br>하자 보수 현황</div>
      <div class="intro-text">
        입주 전 발견한 하자들을<br>
        건설사가 어떻게 고쳤는지<br>
        <b>보수 전 · 후 사진</b>으로 확인하세요.
      </div>
    </div>
    <div class="stats">
      <div class="stats-title">전체 진행 상황</div>
      <div class="stats-row">
        <div class="stat total"><div class="stat-num">${STATS.total}</div><div class="stat-label">전체<br>하자</div></div>
        <div class="stat done"><div class="stat-num">${STATS.photo_verified}</div><div class="stat-label">사진으로<br>확인됨</div></div>
        <div class="stat wait"><div class="stat-num">${STATS.no_after}</div><div class="stat-label">사진<br>준비중</div></div>
      </div>
      <div class="compare">
        <div class="cmp sys"><div class="cmp-num">${STATS.site_completed}</div><div class="cmp-label">건설사<br>완료 처리</div></div>
        <div class="cmp-arrow">›</div>
        <div class="cmp photo"><div class="cmp-num">${STATS.photo_verified}</div><div class="cmp-label">사진으로<br>확인 가능</div></div>
      </div>
      <div class="note">건설사 시스템에는 <b>${STATS.site_completed}곳</b>이 '완료'로 표시돼 있어요.
        그중 보수 후 사진까지 등록돼 <b>전 · 후를 직접 비교</b>할 수 있는 곳은 <b>${STATS.photo_verified}곳</b>이에요.</div>
    </div>
    <div class="hint">왼쪽 <b>☰ 메뉴</b>에서 공간을 골라<br>하나씩 확인해 보세요</div>
    <div class="foot">
      <b>점검일</b> 2026년 5월 9일<br>
      <b>건설사</b> DL이앤씨 · e편한세상 검단 웰카운티<br>
      사진을 누르면 크게 볼 수 있어요
    </div>
  </div>`;
}

function makeCard(it){
  const repaired=it.hasAfter;
  const badge = repaired ? `<span class="badge done">✅ 보수 완료</span>` : `<span class="badge wait">🔧 사진 준비중</span>`;
  let photos='';
  if(repaired && it.before.length && it.after.length){
    photos=`<div class="card-photos">
      <div class="card-photo before"><img loading="lazy" src="${THUMB(it.before[0])}" alt=""><span class="ba-label">전</span></div>
      <div class="card-photo after"><img loading="lazy" src="${THUMB(it.after[0])}" alt=""><span class="ba-label">후</span></div></div>`;
  } else if(it.before.length){
    photos=`<div class="card-photos single"><div class="card-photo before"><img loading="lazy" src="${THUMB(it.before[0])}" alt=""><span class="ba-label">현재</span></div></div>`;
  }
  const date = repaired && it.repairDate ? `🗓 ${fmtDate(it.repairDate)} 보수 완료` : '🔧 보수 예정';
  return `<div class="card" onclick="go('item','${it.sysno}')">
    ${photos}
    <div class="card-body">
      ${badge}
      <div class="card-title">${esc(it.content)}</div>
      <div class="card-ident">
        <span class="chip">${esc(it.part)}</span>
        <span class="chip">${esc(it.dtype)}</span>
        <span class="chip num">DL ${it.sysno}</span>
      </div>
      <div class="card-date">${date}</div>
    </div></div>`;
}

function viewLoc(i){
  const L=LOCATIONS[i];
  return `<div class="page-head">
      <div class="ph-loc">${esc(L.emoji)} ${esc(L.loc)}</div>
      <div class="ph-sub">전체 ${L.items.length}곳 · <b class="done">보수 완료 ${L.done}</b> · <b class="wait">사진 준비중 ${L.wait}</b></div>
    </div>
    <div class="list">${L.items.map(makeCard).join('')}</div>`;
}

function viewItem(sysno){
  const it=ITEMS.find(x=>x.sysno===sysno);
  if(!it) return viewHome();
  const repaired=it.hasAfter;
  const status = repaired
    ? `<div class="detail-status done"><div class="ds-icon">✅</div><div><div class="ds-title">보수 완료</div><div class="ds-sub">${fmtDate(it.repairDate)}에 고쳐졌어요</div></div></div>`
    : `<div class="detail-status wait"><div class="ds-icon">🔧</div><div><div class="ds-title">사진 준비 중</div><div class="ds-sub">보수 진행 중이거나 사진 등록 전이에요</div></div></div>`;
  let photos='';
  if(repaired){
    photos=`<div class="photos">
      <div class="pblock before"><div class="pblock-title"><span class="tag">전</span>보수 전 모습</div>
        <div class="pgrid">${it.before.map(s=>`<img src="${THUMB(s)}" loading="lazy" onclick="openModal('${s}')" alt="보수 전">`).join('')}</div></div>
      <div class="arrow">⬇</div>
      <div class="pblock after"><div class="pblock-title"><span class="tag">후</span>보수 후 모습</div>
        <div class="pgrid">${it.after.map(s=>`<img src="${THUMB(s)}" loading="lazy" onclick="openModal('${s}')" alt="보수 후">`).join('')}</div></div>
    </div>`;
  } else {
    photos=`<div class="photos">
      <div class="pblock before"><div class="pblock-title"><span class="tag">현재</span>현재 모습</div>
        <div class="pgrid">${it.before.length? it.before.map(s=>`<img src="${THUMB(s)}" loading="lazy" onclick="openModal('${s}')" alt="현재">`).join('') : '<div class="no-photo">사진이 없습니다</div>'}</div></div>
    </div>
    <div class="wait-notice"><div class="wn-in"><b>아직 사진이 준비 중이에요</b>이 부분은 보수가 진행 중이거나 작업 후 사진이 아직 등록되지 않았어요.</div></div>`;
  }
  return `<div class="detail-hero"><div class="dh-wrap">
      <div class="loc">${esc(it.emoji)} ${esc(it.loc)}</div>
      <div class="desc">${esc(it.content)}</div>
    </div></div>
    ${status}
    <div class="ident-box">
      <div class="ib-title">식별 정보</div>
      <div class="ident-chips">
        <span class="chip">${esc(it.loc)}</span>
        <span class="chip">${esc(it.part)}</span>
        <span class="chip">${esc(it.dtype)}</span>
        <span class="chip num">DL번호 ${it.sysno}</span>
      </div>
    </div>
    <a class="dl-link" href="${DLBASE}${it.sysno}" target="_blank" rel="noopener">🔧 DL 보수시스템에서 열기 · 수정 →</a>
    <div class="dl-hint">건설사 보수 시스템(로그인 필요)에서 이 항목을 바로 확인·수정할 수 있어요</div>
    ${photos}
    <div class="foot">사진을 누르면 크게 볼 수 있어요</div>`;
}

/* ===== 라우팅 ===== */
function setActive(view, arg){
  document.querySelectorAll('.nav-loc.active, .nav-item.active').forEach(e=>e.classList.remove('active'));
  document.getElementById('navHome').classList.toggle('active', view==='home');
  if(view==='loc'){
    const g=document.getElementById('g'+arg);
    if(g){ openGroup(arg); g.querySelector('.nav-loc').classList.add('active'); }
  }
  if(view==='item'){
    const it=ITEMS.find(x=>x.sysno===arg);
    if(it){ const i=locIdx(it.loc); openGroup(i);
      document.getElementById('g'+i).querySelector('.nav-loc').classList.add('active');
      const ni=document.getElementById('ni'+arg); if(ni) ni.classList.add('active');
    }
  }
}
function openGroup(i){
  LOCATIONS.forEach((_,j)=>document.getElementById('g'+j).classList.toggle('open', j===i));
}
function render(){
  const h=location.hash.slice(1);
  const main=document.getElementById('main');
  let view='home', arg=null;
  if(h.startsWith('loc/')){ view='loc'; arg=parseInt(h.slice(4),10); }
  else if(h.startsWith('item/')){ view='item'; arg=h.slice(5); }

  if(view==='loc' && LOCATIONS[arg]) main.innerHTML=viewLoc(arg);
  else if(view==='item' && ITEMS.find(x=>x.sysno===arg)) main.innerHTML=viewItem(arg);
  else { view='home'; main.innerHTML=viewHome(); }

  setActive(view, arg);
  window.scrollTo(0,0);
}
function go(view, arg){
  closeDrawer();
  if(view==='home') location.hash='';
  else if(view==='loc') location.hash='loc/'+arg;
  else if(view==='item') location.hash='item/'+arg;
  if((view==='home' && !location.hash) ) render();   // hash already empty → force render
}
window.addEventListener('hashchange', render);

/* ===== 드로어(모바일) ===== */
function openDrawer(){ document.getElementById('sidebar').classList.add('open'); document.getElementById('scrim').classList.add('show'); }
function closeDrawer(){ document.getElementById('sidebar').classList.remove('open'); document.getElementById('scrim').classList.remove('show'); }
document.getElementById('btnMenu').addEventListener('click', openDrawer);
document.getElementById('scrim').addEventListener('click', closeDrawer);
document.getElementById('btnHome').addEventListener('click', ()=>go('home'));

/* ===== 모달 ===== */
function openModal(src){ document.getElementById('modalImg').src=src; document.getElementById('modal').classList.add('active'); }
document.getElementById('modalClose').addEventListener('click', ()=>document.getElementById('modal').classList.remove('active'));
document.getElementById('modal').addEventListener('click', e=>{ if(e.target.id==='modal') document.getElementById('modal').classList.remove('active'); });

buildNav();
render();
</script>
</body>
</html>
